<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dawid Bothur — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sb:#171717;--bg:#1e1e1e;--s1:#242424;--s2:#2a2a2a;--bd:#2e2e2e;
  --tx:#ececec;--mu:#8e8ea0;--ac:#d97757;--acd:rgba(217,119,87,.13);
  --gn:#4ade80;--bl:#60a5fa;--yw:#fbbf24;--rd:#f87171;--pp:#a78bfa;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.6;overflow:hidden}

/* ── layout ─────────────────────────────────── */
#app{display:flex;height:100vh}

/* ── sidebar ─────────────────────────────────── */
#sidebar{
  width:256px;flex-shrink:0;background:var(--sb);
  border-right:1px solid var(--bd);
  display:flex;flex-direction:column;padding:12px 8px;
}
.sb-top{display:flex;align-items:center;gap:10px;padding:8px 10px 14px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.db-icon{width:34px;height:34px;border-radius:8px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.sb-name{font-weight:600;font-size:14px;color:var(--tx);line-height:1.2}
.sb-role{font-size:11px;color:var(--mu)}
.sb-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;margin-bottom:4px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s;text-align:left}
.sb-btn:hover{background:var(--s1)}
.sb-label{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;padding:8px 10px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--mu);transition:all .15s;user-select:none}
.nav-item:hover{background:var(--s1);color:var(--tx)}
.nav-item.active{background:var(--acd);color:var(--ac)}
.nav-icon{font-size:14px;width:18px;text-align:center}
.sb-footer{margin-top:auto;padding-top:12px;border-top:1px solid var(--bd)}
.sb-hint{font-size:11px;color:var(--mu);padding:6px 10px;line-height:1.9}

/* ── main ────────────────────────────────────── */
#chat-main{flex:1;min-width:0;display:flex;flex-direction:column}
#chat-header{padding:13px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-icon{width:28px;height:28px;border-radius:6px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.hdr-title{font-weight:600;font-size:15px}
.hdr-badge{margin-left:auto;font-size:12px;color:var(--mu);background:var(--s1);border:1px solid var(--bd);padding:3px 10px;border-radius:20px}

/* ── messages ────────────────────────────────── */
#messages{flex:1;overflow-y:auto;padding:20px 0 8px}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}

.msg-user{display:flex;justify-content:flex-end;padding:5px 24px}
.bubble{max-width:68%;background:var(--s2);border:1px solid var(--bd);border-radius:18px 18px 4px 18px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);line-height:1.5;word-break:break-word}

.msg-asst{padding:5px 24px}
.msg-asst-inner{display:flex;gap:12px;align-items:flex-start;max-width:780px}
.avatar{width:32px;height:32px;border-radius:8px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;margin-top:2px}
.msg-body{flex:1;min-width:0;padding-top:2px}
.msg-sender{font-size:13px;font-weight:600;color:var(--ac);margin-bottom:6px}
.msg-content{font-size:14px;line-height:1.7}

/* ── content helpers ─────────────────────────── */
.sec-title{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.irow{display:flex;align-items:baseline;gap:10px;padding:4px 0}
.ilabel{color:var(--mu);font-size:13px;min-width:90px;flex-shrink:0}
.ival{color:var(--tx)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:13px 15px;margin-bottom:8px}
.card-title{font-weight:600;font-size:14px;color:var(--bl);margin-bottom:2px}
.card-co{font-size:13px;color:var(--gn)}
.card-date{font-size:12px;color:var(--mu);margin:3px 0 6px}
.card-desc{font-size:13px;color:var(--mu)}
.sg{margin-bottom:10px}
.sg-label{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid}
.tg{background:#0d200d;border-color:#1a3d1a;color:#4ade80}
.tb{background:#0c1c2a;border-color:#1a3050;color:#60a5fa}
.ty{background:#221a08;border-color:#3d3010;color:#fbbf24}
.tc{background:#0a1f18;border-color:#123528;color:#34d399}
.tr{background:#1e0c0c;border-color:#381414;color:#f87171}
.tp{background:#180d2a;border-color:#2e1a48;color:#a78bfa}
.help-grid{display:grid;grid-template-columns:max-content 1fr;gap:2px 20px;font-size:13px}
.hcmd{color:var(--yw);font-family:'JetBrains Mono',monospace;padding:3px 0}
.hdesc{color:var(--mu);padding:3px 0}
a{color:var(--bl);text-decoration:none}
a:hover{text-decoration:underline}

/* ── input ───────────────────────────────────── */
#input-area{padding:12px 24px 18px;flex-shrink:0}
#input-box{max-width:780px;background:var(--s2);border:1px solid var(--bd);border-radius:14px;display:flex;align-items:flex-end;gap:8px;padding:10px 12px;transition:border-color .2s}
#input-box:focus-within{border-color:var(--ac)}
#chat-input{flex:1;background:transparent;border:none;outline:none;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:13px;resize:none;min-height:22px;max-height:160px;line-height:1.5;caret-color:var(--ac)}
#chat-input::placeholder{color:var(--mu)}
#send-btn{width:34px;height:34px;background:var(--ac);border:none;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:18px;font-weight:700;transition:opacity .15s;line-height:1}
#send-btn:hover{opacity:.85}
.input-hint{font-size:11px;color:var(--mu);margin-top:6px;max-width:780px}

/* ── typing ──────────────────────────────────── */
.typing{display:flex;gap:4px;align-items:center;padding:4px 0}
.typing span{width:7px;height:7px;background:var(--mu);border-radius:50%;animation:tdot 1.1s infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
</style>
</head>
<body>
<div id="app">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sb-top">
      <div class="db-icon">DB</div>
      <div>
        <div class="sb-name">Dawid Bothur</div>
        <div class="sb-role">Software Tester</div>
      </div>
    </div>

    <button class="sb-btn" onclick="cmdReboot()">✦&nbsp; New Chat</button>

    <div class="sb-label">CV Sections</div>
    <div class="nav-item" data-cmd="about"      onclick="runNav('about')">      <span class="nav-icon">👤</span>About Me</div>
    <div class="nav-item" data-cmd="experience" onclick="runNav('experience')"> <span class="nav-icon">💼</span>Experience</div>
    <div class="nav-item" data-cmd="skills"     onclick="runNav('skills')">     <span class="nav-icon">🧪</span>Skills</div>
    <div class="nav-item" data-cmd="education"  onclick="runNav('education')">  <span class="nav-icon">🎓</span>Education</div>
    <div class="nav-item" data-cmd="languages"  onclick="runNav('languages')">  <span class="nav-icon">🌐</span>Languages</div>
    <div class="nav-item" data-cmd="contact"    onclick="runNav('contact')">    <span class="nav-icon">✉</span>Contact</div>

    <div class="sb-footer">
      <div class="sb-hint">
        Type <code style="color:var(--yw)">/help</code> for commands<br>
        <code style="color:var(--yw)">/generate-data</code><br>to load data
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="chat-main">
    <div id="chat-header">
      <div class="hdr-icon">DB</div>
      <div class="hdr-title">Dawid Bothur — Portfolio</div>
      <div class="hdr-badge">Regular Software Tester</div>
    </div>

    <div id="messages"></div>

    <div id="input-area">
      <div id="input-box">
        <textarea id="chat-input" rows="1" placeholder="Type a command or ask about Dawid…" autocomplete="off" spellcheck="false"></textarea>
        <button id="send-btn" title="Send">↑</button>
      </div>
      <div class="input-hint">Enter to send · Shift+Enter new line · Tab autocomplete</div>
    </div>
  </main>
</div>

<script>
const msgsEl = document.getElementById('messages');
const inp    = document.getElementById('chat-input');
const sendEl = document.getElementById('send-btn');

let loaded = false;
let hist = [], hidx = -1;

/* ── helpers ─────────────────────────────────── */
function sc(){ msgsEl.scrollTop = msgsEl.scrollHeight; }
function e(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tag(t,cls){ return `<span class="tag ${cls}">${e(t)}</span>`; }
function tags(arr,cls){ return arr.map(t=>tag(t,cls)).join(''); }

/* ── append messages ─────────────────────────── */
function userMsg(text){
  const d=document.createElement('div');
  d.className='msg-user';
  d.innerHTML=`<div class="bubble">${e(text)}</div>`;
  msgsEl.appendChild(d); sc();
}

function asstMsg(html){
  const d=document.createElement('div');
  d.className='msg-asst';
  d.innerHTML=`<div class="msg-asst-inner">
    <div class="avatar">DB</div>
    <div class="msg-body">
      <div class="msg-sender">Dawid Bothur</div>
      <div class="msg-content">${html}</div>
    </div>
  </div>`;
  msgsEl.appendChild(d); sc(); return d;
}

/* ── no-data guard ───────────────────────────── */
function noData(name){
  return `<p style="color:var(--rd);margin-bottom:6px">[ NO DATA ] — module: <strong>${e(name.toUpperCase())}</strong></p>
          <p style="color:var(--mu);font-size:13px">Moduł nie został załadowany. Uruchom:</p>
          <p style="margin-top:6px"><code style="color:var(--yw);font-family:'JetBrains Mono',monospace">/generate-data</code></p>`;
}

/* ── section builders ───────────────────────── */
function buildAbout(){
  if(!loaded) return noData('about');
  return `<div class="sec-title">About Me</div>
    <div class="irow"><span class="ilabel">Role</span><span class="ival">Tester oprogramowania · <span style="color:var(--yw)">3+ lata stażu</span></span></div>
    <p style="margin:12px 0 8px">Specjalizuję się w testach <span style="color:var(--gn)">manualnych i automatycznych</span>, kładąc duży nacisk na jakość produktu oraz User Experience.</p>
    <p style="color:var(--mu);font-size:13px;margin-bottom:6px">Projekty <span style="color:var(--bl)">e-commerce</span>:</p>
    <ul style="color:var(--mu);font-size:13px;padding-left:18px;line-height:2;margin-bottom:12px">
      <li>Połączenia telefoniczne [IN/OUT]</li>
      <li>Czaty [TEXT/AUDIO/VIDEO]</li>
      <li>E-mail [IN/OUT] [OTRS/ZNUNY] [AZURE]</li>
      <li>API [POSTMAN/SWAGGER]</li>
      <li>DB [SQL]</li>
    </ul>
    <p style="color:var(--mu);font-size:13px">Przeszłość zawodowa w roli agenta obsługi pozwala mi płynnie wejść w rolę użytkownika końcowego przy weryfikacji systemów.</p>`;
}

function buildContact(){
  if(!loaded) return noData('contact');
  return `<div class="sec-title">Contact</div>
    <div class="irow"><span class="ilabel">✉ Email</span><a href="mailto:dawidbothur@icloud.com">dawidbothur@icloud.com</a></div>
    <div class="irow"><span class="ilabel">📱 Phone</span><span class="ival">+__PHONE__</span></div>
    <div class="irow"><span class="ilabel">📍 Location</span><span class="ival">Ostrów Wielkopolski, Polska</span></div>
    <div class="irow"><span class="ilabel">in LinkedIn</span><a href="https://linkedin.com/in/d-bothur" target="_blank">linkedin.com/in/d-bothur</a></div>
    <div class="irow"><span class="ilabel">◆ GitHub</span><a href="https://github.com/dbothur" target="_blank">github.com/dbothur</a></div>`;
}

function buildSkills(){
  if(!loaded) return noData('skills');
  const cats=[
    {ico:'🧪',k:'Testing',   cls:'tg',t:['Manual Testing','Regression','Exploratory','Smoke','E2E','Test Cases','Test Plans','Documentation']},
    {ico:'🔧',k:'Tools',     cls:'tb',t:['Playwright','DEV Tools','mRemote','MobaXterm','WinSCP','Freelens','BrowserStack','WinDirStat']},
    {ico:'🌐',k:'API',       cls:'tc',t:['REST API','Postman','Swagger','SOAP UI']},
    {ico:'🗄', k:'Database', cls:'ty',t:['SQL','PostgreSQL','DBeaver']},
    {ico:'💻',k:'OS / Infra',cls:'tr',t:['Windows','Services','IIS','Linux','Docker','Kubernetes','Android','iOS']},
    {ico:'⚙', k:'PM Tools', cls:'tb',t:['Jira','Confluence','TestFLO','GitHub','GitLab']},
    {ico:'🤖',k:'AI',        cls:'tp',t:['Claude','ChatGPT','Gemini','Github Copilot']},
    {ico:'</>',k:'Code',     cls:'tg',t:['JavaScript','TypeScript','HTML/CSS','Nginx','Git','Bash','Shell','TOML','CLI','YAML','JSON']},
  ];
  return `<div class="sec-title">Skills</div>`+
    cats.map(c=>`<div class="sg"><div class="sg-label">${c.ico} ${e(c.k)}</div><div class="tags">${tags(c.t,c.cls)}</div></div>`).join('');
}

function buildExperience(){
  if(!loaded) return noData('experience');
  const jobs=[
    {t:'Regular Software Tester',       c:'Alfavox Software Sp. z o.o.', d:'01/2023 — obecnie',
     desc:'Prowadzenie projektów od strony organizacji testów i wdrożeń.'},
    {t:'Junior Software Tester',        c:'Alfavox Software Sp. z o.o.', d:'mm/rrrr — mm/rrrr',
     desc:'Tworzenie dokumentacji testowej, testy API, tworzenie testów automatycznych.'},
    {t:'Beginner Software Tester',      c:'Alfavox Software Sp. z o.o.', d:'mm/rrrr — mm/rrrr',
     desc:'Testowanie manualne aplikacji desktopowych i webowych oraz scenariuszy testowych.'},
    {t:'Młodszy Specjalista E-Commerce',c:'Santander Consumer Bank s.a.', d:'mm/rrrr — mm/rrrr',
     desc:'Obsługa połączeń IN/OUT, realizowanie wniosków kredytowych, sprzedaż ubezpieczeń.'},
  ];
  return `<div class="sec-title">Experience</div>`+
    jobs.map(j=>`<div class="card">
      <div class="card-title">${e(j.t)}</div>
      <div class="card-co">${e(j.c)}</div>
      <div class="card-date">📅 ${e(j.d)}</div>
      <div class="card-desc">${e(j.desc)}</div>
    </div>`).join('');
}

function buildEducation(){
  if(!loaded) return noData('education');
  return `<div class="sec-title">Education</div>
    <div class="card">
      <div class="card-title">🎓 Technik-Informatyk</div>
      <div class="card-co">ZST Ostrów Wielkopolski</div>
      <div class="card-date">📅 2017 — 2021</div>
    </div>`;
}

function buildLanguages(){
  if(!loaded) return noData('languages');
  return `<div class="sec-title">Languages</div>
    <div class="irow"><span class="ilabel">🇵🇱 Polski</span><span style="color:var(--gn)">Native</span></div>
    <div class="irow"><span class="ilabel">🇬🇧 English</span><span style="color:var(--bl)">B2</span></div>`;
}

function buildHelp(){
  const cmds=[
    ['/generate-data','załaduj dane CV'],
    ['/whoami',     'kim jestem — skrót'],
    ['/ls',         'lista sekcji'],
    ['/clear',      'wyczyść czat'],
    ['/newchat',    'zrestartuj sesję'],
    ['/about',      'o mnie'],
    ['/experience', 'doświadczenie zawodowe'],
    ['/education',  'wykształcenie'],
    ['/skills',     'umiejętności techniczne'],
    ['/languages',  'języki'],
    ['/contact',    'dane kontaktowe'],
  ];
  return `<div class="sec-title">Available Commands</div>
    <div class="help-grid">${cmds.map(([c,d])=>`<div class="hcmd">${e(c)}</div><div class="hdesc">${e(d)}</div>`).join('')}</div>
    <p style="color:var(--mu);font-size:12px;margin-top:12px">↑↓ historia · Tab autocomplete · kliknij sekcję w panelu bocznym</p>`;
}

function buildWhoami(){
  return `<div style="margin-bottom:8px"><span style="color:var(--ac);font-weight:700;font-size:16px">Dawid Bothur</span></div>
    <div class="irow"><span class="ilabel">Role</span><span class="ival">Regular Software Tester</span></div>
    <div class="irow"><span class="ilabel">Company</span><span style="color:var(--gn)">Alfavox Software Sp. z o.o.</span></div>
    <div class="irow"><span class="ilabel">Location</span><span class="ival">Ostrów Wielkopolski, Polska</span></div>
    <div class="irow"><span class="ilabel">GitHub</span><a href="https://github.com/dbothur" target="_blank">github.com/dbothur</a></div>`;
}

function buildLs(){
  const items=['about','contact','skills','experience','education','languages'];
  return `<div style="font-family:'JetBrains Mono',monospace;font-size:13px;display:flex;flex-wrap:wrap;gap:10px">
    ${items.map(i=>`<span style="color:var(--bl);font-weight:500">/${i}</span>`).join('')}
    <span style="color:var(--mu)">cv.spec.ts</span>
    <span style="color:var(--mu)">README.md</span>
  </div>`;
}

/* ── npx (animated, inline update) ─────────── */
async function cmdNpx(){
  if(loaded){
    asstMsg('<p style="color:var(--mu)">cv.spec.ts: wszystkie moduły już załadowane.</p>');
    return;
  }
  const mods=['about','contact','skills','experience','education','languages'];
  const wrap=document.createElement('div');
  wrap.className='msg-asst';
  wrap.innerHTML=`<div class="msg-asst-inner">
    <div class="avatar">DB</div>
    <div class="msg-body">
      <div class="msg-sender">Dawid Bothur</div>
      <div class="msg-content" id="_npx" style="font-family:'JetBrains Mono',monospace;font-size:12px;line-height:2"></div>
    </div>
  </div>`;
  msgsEl.appendChild(wrap);
  const cel=document.getElementById('_npx');
  const lines=[`<span style="color:var(--mu)">Running cv.spec.ts...</span>`];
  cel.innerHTML=lines.join('<br>'); sc();
  await new Promise(res=>{
    let i=0;
    const iv=setInterval(()=>{
      if(i<mods.length){
        const ms=Math.floor(Math.random()*120+80);
        lines.push(`<span style="color:var(--gn)">✓</span> <span style="color:var(--mu)">PASS  [</span><span style="color:var(--gn)">${mods[i]}.spec.ts</span><span style="color:var(--mu)">]  ${ms}ms</span>`);
        cel.innerHTML=lines.join('<br>'); sc(); i++;
      } else {
        clearInterval(iv); loaded=true;
        lines.push('');
        lines.push(`<span style="color:var(--gn);font-weight:700">✓ 6 passed</span> <span style="color:var(--mu)">(6 modules · cv.spec.ts)</span>`);
        lines.push(`<span style="color:var(--gn)">▶</span> <span style="color:var(--mu)">Wszystkie dane załadowane.</span>`);
        cel.innerHTML=lines.join('<br>'); sc(); res();
      }
    },220);
  });
}

/* ── nav highlight ───────────────────────────── */
function setActiveNav(cmd){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const el=document.querySelector(`.nav-item[data-cmd="${cmd}"]`);
  if(el) el.classList.add('active');
}

/* ── command dispatch ────────────────────────── */
const TAB_CMDS=['/about','/contact','/skills','/experience','/education','/languages','/whoami','/ls','/help','/clear','/newchat','/generate-data'];
const NAV_CMDS=new Set(['about','contact','skills','experience','education','languages']);
const BUILDERS={about:buildAbout,contact:buildContact,skills:buildSkills,experience:buildExperience,education:buildEducation,languages:buildLanguages,whoami:buildWhoami,ls:buildLs,help:buildHelp};

async function processCmd(raw){
  if(!raw.trim()) return;
  const norm=raw.trim().toLowerCase();
  const full=norm.split(/\s+/)[0];
  const cmd=full.startsWith('/')? full.slice(1) : full;
  userMsg(raw);
  if(norm==='/generate-data'){
    await cmdNpx();
  } else if(cmd==='clear'){
    msgsEl.innerHTML='';
  } else if(cmd==='newchat'){
    asstMsg('<p style="color:var(--mu)">Restarting session...</p>');
    setTimeout(()=>{ msgsEl.innerHTML=''; loaded=false; hist=[]; hidx=-1; inp.value=''; bootSequence(); },400);
  } else if(BUILDERS[cmd]){
    if(NAV_CMDS.has(cmd)) setActiveNav(cmd);
    asstMsg(BUILDERS[cmd]());
  } else {
    asstMsg(`<p style="color:var(--rd)">command not found: <strong>${e(full)}</strong></p><p style="color:var(--mu);font-size:13px;margin-top:4px">Wpisz <code style="color:var(--yw)">/help</code> aby zobaczyć listę komend.</p>`);
  }
  sc();
}

function runNav(cmd){ hist.unshift('/'+cmd); hidx=-1; processCmd('/'+cmd); inp.focus(); }
function cmdReboot(){ processCmd('/newchat'); }

/* ── input events ────────────────────────────── */
function autoResize(){ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,160)+'px'; }
inp.addEventListener('input',autoResize);

inp.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&!ev.shiftKey){
    ev.preventDefault();
    const raw=inp.value.trim(); if(!raw) return;
    hist.unshift(raw); hidx=-1; inp.value=''; autoResize(); processCmd(raw);
  } else if(ev.key==='ArrowUp'){
    ev.preventDefault(); hidx=Math.min(hidx+1,hist.length-1); inp.value=hist[hidx]||''; autoResize();
  } else if(ev.key==='ArrowDown'){
    ev.preventDefault(); hidx=Math.max(hidx-1,-1); inp.value=hidx>=0?hist[hidx]:''; autoResize();
  } else if(ev.key==='Tab'){
    ev.preventDefault();
    const p=inp.value.toLowerCase(); if(!p) return;
    const m=TAB_CMDS.filter(c=>c.startsWith(p));
    if(m.length===1){ inp.value=m[0]; autoResize(); }
  }
});

sendEl.addEventListener('click',()=>{
  const raw=inp.value.trim(); if(!raw) return;
  hist.unshift(raw); hidx=-1; inp.value=''; autoResize(); processCmd(raw);
});

document.addEventListener('click',ev=>{ if(!ev.target.closest('#sidebar')) inp.focus(); });
