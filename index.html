<!DOCTYPE html>
<html lang="pl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dawid Bothur | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://www.nerdfonts.com/assets/css/webfont.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sb:#080808;--bg:#0d0d0d;--s1:#131313;--s2:#191919;--bd:#202020;
  --tx:#e0e0e0;--mu:#636368;--ac:#c2bab0;--acd:rgba(194,186,176,.09);
  --gn:#5a9e70;--bl:#5880a8;--yw:#b89840;--rd:#b84040;--pp:#7860b8;
  --btn-tx:#0d0d0d;
}
[data-theme="light"]{
  --sb:#f2f2f2;--bg:#fafafa;--s1:#ebebeb;--s2:#e3e3e3;--bd:#d0d0d0;
  --tx:#1c1c1e;--mu:#5c5c64;--ac:#7a6e64;--acd:rgba(122,110,100,.10);
  --gn:#2e7d4f;--bl:#2a5f9e;--yw:#7a4800;--rd:#9e2a2a;--pp:#5a3a9e;
  --btn-tx:#fafafa;
}
[data-theme="light"] .tg{background:#e8f5ee;border-color:#b8ddc8;color:#1a6a40}
[data-theme="light"] .tb{background:#e8f0f8;border-color:#b8cce0;color:#1a4a7a}
[data-theme="light"] .ty{background:#f5f0e0;border-color:#dfd080;color:#6a5010}
[data-theme="light"] .tc{background:#e5f5f0;border-color:#a0d8cc;color:#0a5a40}
[data-theme="light"] .tr{background:#f5e5e5;border-color:#d8a0a0;color:#8a1a1a}
[data-theme="light"] .tp{background:#f0e8f5;border-color:#c0a0d8;color:#4a2080}
[data-theme="light"] .sb-label{color:var(--tx)}
[data-theme="light"] .sb-btn{background:var(--ac);border-color:var(--ac);color:var(--btn-tx)}
[data-theme="light"] .sb-btn:hover{background:#6a5e54;border-color:#6a5e54}
[data-theme="light"] .sb-btn-clear{background:var(--rd);border-color:var(--rd);color:var(--btn-tx)}
[data-theme="light"] .sb-btn-clear:hover{background:#7a1a1a;border-color:#7a1a1a}
[data-theme="light"] .sb-btn-gen{background:var(--yw);border-color:var(--yw);color:var(--btn-tx)}
[data-theme="light"] .sb-btn-gen:hover{background:#5c3600;border-color:#5c3600}
[data-theme="light"] .sb-btn-gen.gen-done{background:var(--gn);border-color:var(--gn);color:var(--btn-tx);opacity:.85}
[data-theme="light"] .sb-btn-gen.gen-done:hover{background:var(--gn);border-color:var(--gn)}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.6;overflow:hidden}

/* ── layout ─────────────────────────────────── */
#app{display:flex;height:100vh}

/* ── sidebar ─────────────────────────────────── */
#sidebar{
  width:256px;flex-shrink:0;background:var(--sb);
  border-right:1px solid var(--bd);
  display:flex;flex-direction:column;padding:12px 8px;
  overflow:hidden;
}
#sidebar.collapsed{width:0;padding:0;border-right:none}
.genie-out{overflow:visible!important;transform-origin:top right;animation:genie-out .3s ease-in forwards}
.genie-in {overflow:visible!important;transform-origin:top right;animation:genie-in .35s ease-out forwards}
@keyframes genie-out{
  0%  {transform:scale(1);  opacity:1}
  100%{transform:scale(0);  opacity:0}
}
@keyframes genie-in{
  0%  {transform:scale(0);  opacity:0}
  100%{transform:scale(1);  opacity:1}
}
#sb-toggle,#sb-open{background:transparent;border:none;color:var(--mu);cursor:pointer;width:32px;height:32px;border-radius:6px;font-size:18px;line-height:1;flex-shrink:0;transition:color .15s;display:flex;align-items:center;justify-content:center}
#sb-toggle:hover,#sb-open:hover{color:var(--tx)}
.sb-top{display:flex;align-items:center;gap:10px;padding:8px 10px 14px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.db-icon{width:34px;height:34px;border-radius:8px;overflow:hidden;flex-shrink:0;cursor:pointer}
.db-icon img{width:100%;height:100%;object-fit:cover;display:block}
.sb-name{font-weight:600;font-size:14px;color:var(--tx);line-height:1.2}
.sb-role{font-size:11px;color:var(--mu)}
.sb-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;margin-bottom:4px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s;text-align:left}
.sb-btn:hover{background:var(--s1)}
.sb-btn .nav-icon,.sb-btn-gen .nav-icon{font-size:13px;width:auto}
.sb-btn-clear{color:var(--rd);border-color:var(--rd)}
.sb-btn-clear:hover{background:rgba(184,64,64,.10)}
.sb-btn-gen{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;margin-bottom:10px;border-radius:8px;border:1px solid var(--yw);background:transparent;color:var(--yw);font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s,color .2s,border-color .2s,opacity .2s;text-align:left}
.sb-btn-gen:hover{background:rgba(184,152,64,.10)}
.sb-btn-gen.gen-done{color:var(--gn);border-color:var(--gn);cursor:default;opacity:.65}
.sb-btn-gen.gen-done:hover{background:transparent}
.sb-label{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;padding:8px 10px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--mu);transition:all .15s;user-select:none}
.nav-item:hover{background:var(--s1);color:var(--tx)}
.nav-item.active{background:var(--acd);color:var(--ac)}
.nav-icon{font-size:14px;width:18px;text-align:center}
.sb-footer{margin-top:auto;padding-top:12px;border-top:1px solid var(--bd)}

/* ── main ────────────────────────────────────── */
#chat-main{flex:1;min-width:0;display:flex;flex-direction:column}
#chat-header{padding:13px 24px 13px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.hdr-title{font-weight:600;font-size:15px}
.hdr-badge{margin-left:auto;font-size:12px;color:var(--mu);background:var(--s1);border:1px solid var(--bd);padding:3px 10px;border-radius:20px}
#lang-btn{background:transparent;border:1px solid;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;letter-spacing:.06em;cursor:pointer;font-family:inherit;transition:all .15s;flex-shrink:0}
#lang-btn.lang-pl{background:var(--rd);border-color:var(--rd);color:#fff}
#lang-btn.lang-pl:hover{opacity:.8}
#lang-btn.lang-en{background:var(--bl);border-color:var(--bl);color:#fff}
#lang-btn.lang-en:hover{opacity:.8}

/* ── messages ────────────────────────────────── */
#messages{flex:1;overflow-y:auto;padding:20px 0 8px}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}

.msg-user{display:flex;justify-content:flex-end;padding:5px 24px;max-width:calc(780px + 48px);margin:0 auto;width:100%}
.bubble{max-width:68%;background:var(--s2);border:1px solid var(--bd);border-radius:18px 18px 4px 18px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);line-height:1.5;word-break:break-word}

.msg-asst{padding:5px 24px}
.msg-asst-inner{display:flex;gap:12px;align-items:flex-start;max-width:780px;margin:0 auto}
.avatar{width:32px;height:32px;border-radius:8px;overflow:hidden;flex-shrink:0;margin-top:2px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.msg-body{flex:1;min-width:0;padding-top:2px}
.msg-sender{font-size:13px;font-weight:600;color:var(--ac);margin-bottom:6px}
.msg-content{font-size:14px;line-height:1.7}

/* ── content helpers ─────────────────────────── */
.sec-title{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.irow{display:flex;align-items:center;gap:10px;padding:4px 0}
.ilabel{display:inline-flex;align-items:center;gap:5px;color:var(--mu);font-size:13px;min-width:90px;flex-shrink:0}
.ival{color:var(--tx)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:13px 15px;margin-bottom:8px}
.card-title{font-weight:600;font-size:14px;color:var(--bl);margin-bottom:2px}
.card-co{font-size:13px;color:var(--gn)}
.card-date{font-size:12px;color:var(--mu);margin:3px 0 6px}
.card-desc{font-size:13px;color:var(--mu)}
.sg{margin-bottom:10px}
.sg-label{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid}
.tg{background:#0d200d;border-color:#1a3d1a;color:#4ade80}
.tb{background:#0c1c2a;border-color:#1a3050;color:#60a5fa}
.ty{background:#221a08;border-color:#3d3010;color:#fbbf24}
.tc{background:#0a1f18;border-color:#123528;color:#34d399}
.tr{background:#1e0c0c;border-color:#381414;color:#f87171}
.tp{background:#180d2a;border-color:#2e1a48;color:#a78bfa}
.help-grid{display:grid;grid-template-columns:max-content 1fr;gap:2px 20px;font-size:13px}
.hcmd{color:var(--yw);font-family:'JetBrains Mono',monospace;padding:3px 0}
.hdesc{color:var(--mu);padding:3px 0}

/* ── help overlay ────────────────────────────── */
#help-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);opacity:0;transition:opacity .22s;pointer-events:none}
#help-overlay.visible{opacity:1;pointer-events:all}
#help-panel{background:var(--sb);border:1px solid var(--bd);border-radius:14px;padding:24px 28px;max-width:480px;width:90%;max-height:85vh;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;box-shadow:0 24px 64px rgba(0,0,0,.55);position:relative}
#help-panel::-webkit-scrollbar{display:none}
#help-overlay.visible #help-panel{animation:revealIn .25s ease-out}
.ov-title{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--yw);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
#help-close{position:absolute;top:14px;right:14px;background:transparent;border:none;color:var(--mu);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px;transition:color .15s}
#help-close:hover{color:var(--tx)}
.ov-intro{font-size:13px;color:var(--mu);margin-bottom:20px;line-height:1.6}
.ov-section{font-size:10px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 5px}
.ov-grid{display:grid;grid-template-columns:max-content 1fr;gap:1px 16px}
.ov-cmd{color:var(--yw);font-family:'JetBrains Mono',monospace;font-size:12px;padding:2px 0}
.ov-desc{color:var(--mu);font-size:12px;padding:2px 0}
@media(max-width:640px){#help-panel{padding:18px 16px}.ov-keyboard{display:none}}
a{color:var(--bl);text-decoration:none}
a:hover{text-decoration:underline}

/* ── input ───────────────────────────────────── */
#input-area{padding:12px 24px 18px;flex-shrink:0}
#input-box{max-width:780px;margin:0 auto;background:var(--s2);border:1px solid var(--bd);border-radius:14px;display:flex;align-items:center;gap:8px;padding:10px 12px;transition:border-color .2s}
#input-box:focus-within{border-color:var(--ac)}
#chat-input{flex:1;background:transparent;border:none;outline:none;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:13px;resize:none;min-height:22px;max-height:160px;line-height:1.5;caret-color:var(--ac);scrollbar-width:none;-ms-overflow-style:none}
#chat-input::-webkit-scrollbar{display:none}
#chat-input::placeholder{color:var(--mu)}
#send-btn{width:34px;height:34px;background:var(--ac);border:none;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--btn-tx);font-size:18px;font-weight:700;transition:opacity .15s;line-height:1}
#send-btn:hover{opacity:.85}
.input-hint{font-size:11px;color:var(--mu);margin-top:6px;max-width:780px;margin-left:auto;margin-right:auto}

/* ── typing ──────────────────────────────────── */
.typing{display:flex;gap:4px;align-items:center;padding:4px 0}
.typing span{width:7px;height:7px;background:var(--mu);border-radius:50%;animation:tdot 1.1s infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}

/* ── section reveal ──────────────────────────── */
@keyframes revealIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
.msg-content.reveal{animation:revealIn .28s ease-out forwards}

/* ── theme transition ────────────────────────── */
html,body,#sidebar,#chat-main,#chat-header,#input-area,#input-box,.card,.nav-item,.bubble,.tag,.sb-btn,.hdr-badge{transition:background-color .18s,color .18s,border-color .18s}
.theme-switch{display:flex;align-items:center;cursor:pointer;flex-shrink:0;user-select:none}
.theme-switch input{display:none}
.sw-track{width:44px;height:24px;background:var(--s2);border:1px solid var(--bd);border-radius:12px;position:relative;flex-shrink:0;transition:background .22s,border-color .22s}
#theme-toggle:checked~.sw-track{background:var(--pp);border-color:var(--pp)}
.sw-thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .22s}
#theme-toggle:checked~.sw-track .sw-thumb{transform:translateX(20px)}
.sw-moon{display:none;color:#1c1c3a}.sw-sun{display:block;color:#e08000}
#theme-toggle:checked~.sw-track .sw-moon{display:block}
#theme-toggle:checked~.sw-track .sw-sun{display:none}

/* ── mobile ──────────────────────────────────── */
#sb-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;cursor:pointer}
#sb-backdrop.active{display:block}
@media(max-width:640px){
  #sidebar{position:fixed;top:0;left:0;height:100%;z-index:100;width:256px!important;padding:12px 8px!important;border-right:1px solid var(--bd)!important;transform:translateX(-100%);transition:transform .25s ease}
  #sidebar.mobile-open{transform:translateX(0)!important}
  #sidebar.collapsed{transform:translateX(-100%);animation:none!important}
  #sidebar.genie-out,#sidebar.genie-in{animation:none!important}
  .hdr-badge{display:none}
  .msg-user,.msg-asst{padding:5px 12px}
  .msg-user{max-width:100%}
  #input-area{padding:8px 12px 14px}
  #chat-header{padding:10px 12px;gap:6px}
  #chat-input{font-size:16px}
  button,a,.nav-item{touch-action:manipulation}
  .theme-switch{margin-left:auto}
  #app{height:100dvh}
  .input-hint{display:none}
  .help-footer-hint{display:none}
  #chat-input::-webkit-scrollbar{display:none}
  #chat-input{-ms-overflow-style:none;scrollbar-width:none}
  .avatar{display:none}
  .msg-asst-inner{gap:0}
}
</style>
</head>
<body>
<div id="app" data-testid="app">

  <!-- SIDEBAR -->
  <aside id="sidebar" data-testid="sidebar">
    <div class="sb-top" data-testid="sidebar-top">
      <a href="https://github.com/dbothur" target="_blank" rel="noopener noreferrer" title="GitHub profile" data-testid="github-profile-link"><div class="db-icon" data-testid="avatar-icon"><img src="https://github.com/dbothur.png" alt="DB" data-testid="avatar-img"></div></a>
      <div data-testid="profile-info">
        <div class="sb-name" data-testid="profile-name">Dawid Bothur</div>
        <div class="sb-role" data-testid="profile-role">Software Tester</div>
      </div>
      <button id="sb-toggle" title="Toggle sidebar" style="margin-left:auto" data-testid="sidebar-toggle-btn">☰</button>
    </div>

    <button class="sb-btn" onclick="cmdReboot()" data-testid="new-chat-btn"><span class="nav-icon">✦</span><span id="sb-newchat-label" data-testid="new-chat-label">New Chat</span></button>
    <button class="sb-btn sb-btn-clear" onclick="processCmd('/clear')" data-testid="clear-chat-btn"><span class="nav-icon nf nf-fa-eraser"></span><span data-i18n="navClear">Clear Chat</span></button>
    <button id="sb-gen-btn" class="sb-btn-gen" onclick="processCmd('/generate-data')" data-testid="generate-data-btn"><span id="sb-gen-icon" class="nav-icon nf nf-cod-database"></span><span id="sb-gen-label">Generate Data</span></button>

    <div class="sb-label" id="sb-general-label" data-testid="general-label">General</div>
    <div class="nav-item" onclick="showOverlay('whoami')" data-testid="nav-whoami"><span class="nav-icon nf nf-fa-id_card"></span><span data-i18n="navWhoami">Who am I</span></div>
    <div class="nav-item" data-cmd="interests"  onclick="showOverlay('interests')"  data-testid="nav-interests">  <span class="nav-icon nf nf-fa-heart"></span><span data-i18n="navInterests">Interests</span></div>

    <div class="sb-label" id="sb-cv-label" style="margin-top:10px" data-testid="cv-sections-label">CV Sections</div>
    <div class="nav-item" data-cmd="about"      onclick="showOverlay('about')"      data-testid="nav-about">      <span class="nav-icon nf nf-fa-user"></span><span data-i18n="navAbout">About Me</span></div>
    <div class="nav-item" data-cmd="experience" onclick="showOverlay('experience')" data-testid="nav-experience"> <span class="nav-icon nf nf-fa-briefcase"></span><span data-i18n="navExperience">Experience</span></div>
    <div class="nav-item" data-cmd="skills"     onclick="showOverlay('skills')"     data-testid="nav-skills">     <span class="nav-icon nf nf-fa-wrench"></span><span data-i18n="navSkills">Skills</span></div>
    <div class="nav-item" data-cmd="education"  onclick="showOverlay('education')"  data-testid="nav-education">  <span class="nav-icon nf nf-fa-graduation_cap"></span><span data-i18n="navEducation">Education</span></div>
    <div class="nav-item" data-cmd="languages"  onclick="showOverlay('languages')"  data-testid="nav-languages">  <span class="nav-icon nf nf-fa-language"></span><span data-i18n="navLanguages">Languages</span></div>
    <div class="nav-item" data-cmd="contact"    onclick="showOverlay('contact')"    data-testid="nav-contact">    <span class="nav-icon nf nf-fa-envelope"></span><span data-i18n="navContact">Contact</span></div>

    <div class="sb-footer" data-testid="sidebar-footer">
      <button class="sb-btn" onclick="showHelpOverlay()" data-testid="help-btn"><span class="nav-icon nf nf-fa-question_circle"></span><span data-i18n="navHelp">Help</span></button>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="chat-main" data-testid="chat-main">
    <div id="chat-header" data-testid="chat-header">
      <button id="sb-open" title="Open sidebar" style="display:none" data-testid="sidebar-open-btn">☰</button>
      <div class="hdr-icon" data-testid="header-icon"><svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></div>
      <div class="hdr-title" data-testid="header-title">Dawid Bothur - Portfolio</div>
      <div class="hdr-badge" data-testid="header-badge">Regular Software Tester</div>
      <label class="theme-switch" title="Toggle light/dark mode" data-testid="theme-switch">
        <input type="checkbox" id="theme-toggle" onchange="toggleTheme()" data-testid="theme-toggle-input">
        <span class="sw-track" data-testid="theme-switch-track">
          <span class="sw-thumb" data-testid="theme-switch-thumb">
            <span class="sw-moon" data-testid="theme-moon-icon">☾</span>
            <span class="sw-sun" data-testid="theme-sun-icon">☀</span>
          </span>
        </span>
      </label>
      <button id="lang-btn" class="lang-pl" onclick="switchLang()" title="Switch language" data-testid="lang-btn">PL</button>
    </div>

/* ── language switch ─────────────────────────── */
function applyLangUI(next){
  currentLang = next;
  document.getElementById('html-root').lang = currentLang;
  const langBtn = document.getElementById('lang-btn');
  langBtn.textContent = currentLang === 'pl' ? 'PL' : 'EN';
  langBtn.className = currentLang === 'pl' ? 'lang-pl' : 'lang-en';
document.getElementById('sb-cv-label').textContent = l('cvSections');
  document.getElementById('sb-general-label').textContent = l('navGeneral');
  document.getElementById('sb-newchat-label').textContent = l('newChat');
  const genLbl = document.getElementById('sb-gen-label');
  if(genLbl) genLbl.textContent = loaded ? l('genDataDone') : l('genDataBtn');
  document.getElementById('input-hint').textContent = l('inputHint');
  inp.dataset.placeholder = l('placeholder');
  syncPlaceholder();
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if(T[currentLang][key]) el.textContent = T[currentLang][key];
  });
}

function switchLang(target){
  const next = target || (currentLang === 'pl' ? 'en' : 'pl');
  if(next !== 'pl' && next !== 'en') return;
  applyLangUI(next);
  msgsEl.innerHTML=''; hist=[]; hidx=-1;
  bootSequence();
}

/* ── npx (animated, inline update) ─────────── */
async function cmdNpx(){
  if(loaded){
    asstMsg(l('alreadyLoaded'));
    return;
  }
  const mods=['about','contact','skills','experience','education','languages'];
  const wrap=document.createElement('div');
  wrap.className='msg-asst';
  wrap.innerHTML=`<div class="msg-asst-inner">
    <div class="avatar"><img src="https://github.com/dbothur.png" alt="DB"></div>
    <div class="msg-body">
      <div class="msg-sender">Dawid Bothur</div>
      <div class="msg-content" id="_npx" style="font-family:'JetBrains Mono',monospace;font-size:12px;line-height:2"></div>
    </div>
  </div>`;
  msgsEl.appendChild(wrap);
  const cel=document.getElementById('_npx');
  const lines=[`<span style="color:var(--mu)">${e(l('loadingModules'))}</span>`];
  cel.innerHTML=lines.join('<br>'); sc();
  await new Promise(res=>{
    let i=0;
    const iv=setInterval(()=>{
      if(i<mods.length){
        const ms=Math.floor(Math.random()*120+80);
        lines.push(`<span style="color:var(--gn)">✓</span> <span style="color:var(--mu)">[INFO][</span><span style="color:var(--gn)">${mods[i]}.module</span><span style="color:var(--mu)">] → ${e(l('loadedOk'))}  ${ms}ms</span>`);
        cel.innerHTML=lines.join('<br>'); sc(); i++;
      } else {
        clearInterval(iv); loaded=true;
        lines.push('');
        lines.push(`<span style="color:var(--gn);font-weight:700">✓ 6 loaded</span> <span style="color:var(--mu)">(6 modules)</span>`);
        lines.push(`<span style="color:var(--gn)">▶</span> <span style="color:var(--mu)">${e(l('allLoaded'))}</span>`);
        cel.innerHTML=lines.join('<br>'); sc();
        const gb=document.getElementById('sb-gen-btn');
        if(gb){gb.classList.add('gen-done');gb.disabled=true;}
        const gi=document.getElementById('sb-gen-icon');
        if(gi){gi.className='nav-icon nf nf-fa-check';}
        const gl=document.getElementById('sb-gen-label');
        if(gl){gl.textContent=l('genDataDone');}
        res();
      }
    },220);
  });
}

      </div>
    </div>
    `;
}

const OV_TITLES = {
  help:       ()=>l('overlayTitle'),
  whoami:     ()=>l('navWhoami'),
  interests:  ()=>l('navInterests'),
  about:      ()=>l('navAbout'),
  experience: ()=>l('navExperience'),
  education:  ()=>l('navEducation'),
  skills:     ()=>l('navSkills'),
  languages:  ()=>l('navLanguages'),
  contact:    ()=>l('navContact'),
};

function showOverlay(cmd){
  const titleFn = OV_TITLES[cmd];
  document.getElementById('ov-title').textContent = titleFn ? titleFn() : cmd;
  let body;
  if(cmd === 'help'){
    body = buildOverlayContent();
  } else {
    const tmp = document.createElement('div');
    tmp.innerHTML = BUILDERS[cmd] ? BUILDERS[cmd]() : '';
    const secTitle = tmp.querySelector('.sec-title');
    if(secTitle) secTitle.remove();
    body = tmp.innerHTML;
  }
  document.getElementById('ov-body').innerHTML = body;
  document.getElementById('help-overlay').classList.add('visible');
}

function showHelpOverlay(){ showOverlay('help'); }

function hideHelpOverlay(){
  document.getElementById('help-overlay').classList.remove('visible');
}

/* ── nav highlight ───────────────────────────── */
function setActiveNav(cmd){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const el=document.querySelector(`.nav-item[data-cmd="${cmd}"]`);
  if(el) el.classList.add('active');
}

/* ── animated section loader ─────────────────── */
async function showSection(cmd){
  const wrap=document.createElement('div');
  wrap.className='msg-asst';
  wrap.innerHTML=`<div class="msg-asst-inner">
    <div class="avatar"><img src="https://github.com/dbothur.png" alt="DB"></div>
    <div class="msg-body">
      <div class="msg-sender">Dawid Bothur</div>
      <div class="msg-content"><div class="typing"><span></span><span></span><span></span></div></div>
    </div>
  </div>`;
  msgsEl.appendChild(wrap); sc();
  await sleep(520);
  const content=wrap.querySelector('.msg-content');
  content.innerHTML=BUILDERS[cmd]();
  content.classList.add('reveal');
  sc();
}

/* ── command dispatch ────────────────────────── */
const TAB_CMDS=['/about','/contact','/skills','/experience','/education','/languages','/interests','/whoami','/help','/clear','/newchat','/generate-data','/lang'];
const NAV_CMDS=new Set(['about','contact','skills','experience','education','languages','interests']);
const BUILDERS={about:buildAbout,contact:buildContact,skills:buildSkills,experience:buildExperience,education:buildEducation,languages:buildLanguages,interests:buildInterests,whoami:buildWhoami,help:buildHelp};

async function processCmd(raw){
  if(!raw.trim()) return;
  const norm=raw.trim().toLowerCase();
  const parts=norm.split(/\s+/);
  const full=parts[0];
  if(!full.startsWith('/')){
    userMsg(raw);
    asstMsg(l('cmdNotFound')(e(full)));
    sc(); return;
  }
  const cmd=full.slice(1);
  userMsg(raw);
  if(norm==='/generate-data'){
    await cmdNpx();
  } else if(cmd==='clear'){
    msgsEl.innerHTML='';
  } else if(cmd==='newchat'){
    asstMsg(`<p style="color:var(--mu)">${e(l('newChatStarting'))}</p>`);
    setTimeout(()=>{
      msgsEl.innerHTML=''; loaded=false; hist=[]; hidx=-1; inp.value='';
      const gb=document.getElementById('sb-gen-btn');
      if(gb){gb.classList.remove('gen-done');gb.disabled=false;}
      const gi=document.getElementById('sb-gen-icon');
      if(gi){gi.className='nav-icon nf nf-cod-database';}
      const gl=document.getElementById('sb-gen-label');
      if(gl){gl.textContent=l('genDataBtn');}
      bootSequence();
    },400);
  } else if(cmd==='lang'){
    const arg=parts[1];
    if(!arg){
      asstMsg(l('langCurrent')(currentLang));
    } else if(arg==='pl'||arg==='en'){
      applyLangUI(arg);
      msgsEl.innerHTML=''; hist=[]; hidx=-1;
      bootSequence();
      return;
    } else {
      asstMsg(l('langInvalid'));
    }
  } else if(BUILDERS[cmd]){
    if(NAV_CMDS.has(cmd)) setActiveNav(cmd);
    await showSection(cmd);
  } else {
    asstMsg(l('cmdNotFound')(e(full)));
  }
  sc();
}

function cmdReboot(){ processCmd('/newchat'); }

/* ── input events ────────────────────────────── */
function autoResize(){ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,160)+'px'; }
inp.addEventListener('input',autoResize);

inp.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&!ev.shiftKey){
    ev.preventDefault();
    const raw=inp.value.trim(); if(!raw) return;
    hist.unshift(raw); hidx=-1; inp.value=''; autoResize(); processCmd(raw);
  } else if(ev.key==='ArrowUp'){
    ev.preventDefault(); hidx=Math.min(hidx+1,hist.length-1); inp.value=hist[hidx]||''; autoResize();
  } else if(ev.key==='ArrowDown'){
    ev.preventDefault(); hidx=Math.max(hidx-1,-1); inp.value=hidx>=0?hist[hidx]:''; autoResize();
  } else if(ev.key==='Tab'){
    ev.preventDefault();
    const p=inp.value.toLowerCase(); if(!p) return;
    const m=TAB_CMDS.filter(c=>c.startsWith(p));
    if(m.length===1){ inp.value=m[0]; autoResize(); }
  }
});

sendEl.addEventListener('click',()=>{
  const raw=inp.value.trim(); if(!raw) return;
  hist.unshift(raw); hidx=-1; inp.value=''; autoResize(); processCmd(raw);
});

  ].join('\n');
  const msg = asstMsg(
    `<div data-ascii style="font-family:'JetBrains Mono',monospace;font-size:8.5px;line-height:1.2;color:var(--tx);white-space:pre;overflow:hidden;margin-bottom:16px">${ascii}</div>`+

function isMobile(){ return window.innerWidth<=640; }

function closeMobileSidebar(){
  const sb=document.getElementById('sidebar');
  const bd=document.getElementById('sb-backdrop');
  sb.classList.remove('mobile-open');
  bd.classList.remove('active');
}

function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const open=document.getElementById('sb-open');
  const bd=document.getElementById('sb-backdrop');
  if(isMobile()){
    if(sb.classList.contains('mobile-open')){
      closeMobileSidebar();
    } else {
      sb.classList.remove('collapsed');
      sb.classList.add('mobile-open');
      bd.classList.add('active');
    }
    return;
  }
  sb.classList.remove('genie-out','genie-in');
  void sb.offsetWidth;
  if(sb.classList.contains('collapsed')){
    sb.classList.remove('collapsed');
    void sb.offsetWidth;
    sb.classList.add('genie-in');
    open.style.display='none';
    sb.addEventListener('animationend',()=>sb.classList.remove('genie-in'),{once:true});
  } else {
    sb.classList.add('genie-out');
    open.style.display='flex';
    sb.addEventListener('animationend',()=>{
      sb.classList.remove('genie-out');
      sb.classList.add('collapsed');
    },{once:true});
  }
}
document.getElementById('sb-toggle').addEventListener('click',toggleSidebar);
document.getElementById('sb-open').addEventListener('click',toggleSidebar);
document.getElementById('sb-backdrop').addEventListener('click',closeMobileSidebar);
document.getElementById('help-overlay').addEventListener('click',function(e){ if(e.target===this) hideHelpOverlay(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') hideHelpOverlay(); });

/* ── close sidebar on mobile after nav tap ───── */
document.querySelectorAll('.nav-item,.sb-btn').forEach(el=>{
  el.addEventListener('click',()=>{ if(isMobile()) closeMobileSidebar(); });
});

/* ── mobile init ──────────────────────────────── */
function syncPlaceholder(){
  function truncate(full){
    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d');
    ctx.font='16px "JetBrains Mono",monospace';
    const maxW=inp.clientWidth-4;
    if(ctx.measureText(full).width<=maxW) return full;
    let s=full;
    while(s.length>0&&ctx.measureText(s+'...').width>maxW) s=s.slice(0,-1);
    return s+'...';
  }
  const full=inp.dataset.placeholder||l('placeholder');
  inp.placeholder=isMobile()?truncate(full):full;
}
(function initMobile(){
  inp.dataset.placeholder=inp.placeholder;
  if(isMobile()){
    const sb=document.getElementById('sidebar');
    const open=document.getElementById('sb-open');
    sb.classList.add('collapsed');
    open.style.display='flex';
  }
  syncPlaceholder();
  window.addEventListener('resize',()=>{
    syncPlaceholder();
    if(!isMobile()){
      const sb=document.getElementById('sidebar');
      const bd=document.getElementById('sb-backdrop');
      const open=document.getElementById('sb-open');
      sb.classList.remove('mobile-open','collapsed','genie-out','genie-in');
      bd.classList.remove('active');
      open.style.display='none';
    }
  });
})();

/* ── theme ────────────────────────────────────── */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  const toggle=document.getElementById('theme-toggle');
  if(toggle) toggle.checked=(theme==='dark');
  localStorage.setItem('theme',theme);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')||'dark';
  applyTheme(cur==='dark'?'light':'dark');
}
(function(){
  const saved=localStorage.getItem('theme');
  applyTheme(saved||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
})();

applyLangUI('pl');
bootSequence();
</script>
